[project]
name = "openagent-control"
version = "0.1.0"
description = "Agent identity & governance control plane: policy-gated, credential-brokered, cryptographically audited tool execution for autonomous agents."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shail Shah", email = "shailvshah@gmail.com" }]
keywords = [
    "mcp", "model-context-protocol", "ai-agents", "agent-governance",
    "opa", "rego", "oauth2", "spiffe", "audit", "zero-trust",
]
classifiers = [
    # 3 - Alpha, not 4/5: identity defaults to a stub and the audit signing key
    # is in-process. Claiming Production/Stable would misrepresent that.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

dependencies = [
    "fastapi (>=0.115.0,<0.116.0)",
    "uvicorn[standard] (>=0.31.1,<1.0.0)",
    # The official MCP SDK. This is an MCP gateway: the Streamable HTTP
    # transport (initialize handshake, session ids, SSE framing) is implemented
    # by the SDK rather than approximated here — see ADR-0011.
    "mcp (>=1.28.1,<2.0.0)",
    "httpx (>=0.27.0,<0.28.0)",
    "pydantic (>=2.8.0,<3.0.0)",
    "pydantic-settings (>=2.4.0,<3.0.0)",
    "cryptography (>=43.0.0,<44.0.0)",
    "opentelemetry-api (>=1.26.0,<2.0.0)",
    "opentelemetry-sdk (>=1.26.0,<2.0.0)",
    "pyyaml (>=6.0.0,<7.0.0)",
    "pyjwt (>=2.9.0,<3.0.0)",
]

[project.optional-dependencies]
# Postgres + Redis backends (ADR-0009). The default install runs the gateway
# with the in-process ledger and file registry only — ~43MB less resident
# memory and a much smaller footprint. Install with:  pip/poetry ... [persistence]
persistence = [
    "sqlalchemy[asyncio] (>=2.0.0,<3.0.0)",
    "asyncpg (>=0.29.0,<0.30.0)",
    "alembic (>=1.13.0,<2.0.0)",
    "redis (>=5.0.0,<6.0.0)",
    "greenlet (>=3.0.0,<4.0.0)",
]

[project.scripts]
openagent-control = "openagent_control.cli:main"

[project.urls]
Homepage = "https://github.com/shailvshah/openagent-control"
Repository = "https://github.com/shailvshah/openagent-control"
Documentation = "https://github.com/shailvshah/openagent-control/blob/main/docs/deployment.md"
Issues = "https://github.com/shailvshah/openagent-control/issues"
Changelog = "https://github.com/shailvshah/openagent-control/releases"

[tool.poetry]
packages = [{ include = "openagent_control", from = "src" }]
# Non-Python runtime files must be listed explicitly or the wheel ships only
# .py and the gateway starts, reports healthy, and fails every request.
# Verified by tests/integration/test_packaging.py.
include = [
    { path = "src/openagent_control/py.typed", format = ["sdist", "wheel"] },
    { path = "src/openagent_control/alembic.ini", format = ["sdist", "wheel"] },
    { path = "src/openagent_control/migrations/**/*", format = ["sdist", "wheel"] },
    { path = "src/openagent_control/resources/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.group.examples]
optional = true

[tool.poetry.group.examples.dependencies]
langchain = "^1.0.0"
langgraph = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
black = "^24.8.0"
types-pyyaml = "^6.0.12.20260724"
aiosqlite = "^0.20.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." so the integration tests can import examples/ — the enterprise scenario's
# authorization server and MCP server are the real components under test there.
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "--cov=openagent_control --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["openagent_control"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]
