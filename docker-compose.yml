# Default stack = what you would actually deploy: the gateway and OPA.
#
#   docker compose up                          gateway + OPA
#   docker compose --profile persistence up    + Postgres + Redis
#   docker compose --profile demo up           + a demo IdP and MCP server
#
# The demo services are behind a profile on purpose. They ship a hardcoded
# client secret and an authorization server that will mint a token for anyone
# who asks — fine for a walkthrough, a serious foot-gun in anything reachable.
# See examples/enterprise_scenario/.
services:
  gateway:
    build: .
    image: openagent-control:local
    ports:
      - "8000:8000"
    environment:
      - OAC_OPA_URL=http://opa:8181/v1/data/openagent/authz
      - OAC_REGISTRY_PATH=/etc/openagent-control/agents.yaml
      # Everything below is unset by default: the gateway runs with the
      # in-process ledger and file registry and no external dependencies.
      - OAC_MCP_UPSTREAM_URL=${OAC_MCP_UPSTREAM_URL:-http://enterprise-backend:8080/mcp}
      - OAC_MCP_UPSTREAM_MODE=${OAC_MCP_UPSTREAM_MODE:-streamable-http}
      - OAC_IDENTITY_MODE=${OAC_IDENTITY_MODE:-header}
      - OAC_OIDC_DISCOVERY_URL=${OAC_OIDC_DISCOVERY_URL:-}
      - OAC_OIDC_AUDIENCE=${OAC_OIDC_AUDIENCE:-}
      - OAC_TOKEN_EXCHANGE_MODE=${OAC_TOKEN_EXCHANGE_MODE:-stub}
      - OAC_TOKEN_EXCHANGE_URL=${OAC_TOKEN_EXCHANGE_URL:-}
      - OAC_TOKEN_EXCHANGE_CLIENT_ID=${OAC_TOKEN_EXCHANGE_CLIENT_ID:-}
      - OAC_TOKEN_EXCHANGE_CLIENT_SECRET=${OAC_TOKEN_EXCHANGE_CLIENT_SECRET:-}
      - OAC_DELEGATED_AUDIENCE=${OAC_DELEGATED_AUDIENCE:-openagent-control-mcp-upstream}
      - OAC_DATABASE_URL=${OAC_DATABASE_URL:-}
      - OAC_REDIS_URL=${OAC_REDIS_URL:-}
    volumes:
      # The registry is the authorization boundary — mounted read-only so the
      # gateway cannot rewrite its own allowlist (ADR-0008).
      - ./registry/agents.yaml:/etc/openagent-control/agents.yaml:ro
    depends_on:
      - opa

  opa:
    image: openpolicyagent/opa:latest
    # --addr :8181, not the image's own default of localhost:8181 — bound to
    # loopback, the gateway container can reach it over the compose network
    # only via published host ports, which is not what OAC_OPA_URL uses.
    command: ["run", "--server", "--addr", ":8181", "/policies"]
    ports:
      - "8181:8181"
    volumes:
      # Canonical policy source, shipped inside the package so the container
      # and a pip install evaluate identical Rego.
      - ./src/openagent_control/resources/policies:/policies:ro

  # --- optional persistence (ADR-0009) -------------------------------------
  # Run `openagent-control migrate` once after starting these, or the gateway
  # connects fine and then fails every query with `no such table`.
  postgres:
    image: postgres:16-alpine
    profiles: ["persistence"]
    environment:
      - POSTGRES_USER=oac
      - POSTGRES_PASSWORD=oac
      - POSTGRES_DB=oac
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oac"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["persistence"]
    ports:
      - "6379:6379"

  # Separate process from the gateway (ADR-0014): shares the same Postgres,
  # never imports GovernedExecutionService/PolicyEngine/MCPUpstream. Requires
  # Postgres unconditionally, so it lives under the same profile.
  control-plane:
    build: .
    image: openagent-control:local
    profiles: ["persistence"]
    entrypoint: ["openagent-control", "serve-control-plane", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      - OAC_DATABASE_URL=${OAC_DATABASE_URL:-postgresql+asyncpg://oac:oac@postgres:5432/oac}
      - OAC_CONTROL_PLANE_OPERATOR_AUTH_MODE=${OAC_CONTROL_PLANE_OPERATOR_AUTH_MODE:-api-key}
      - OAC_CONTROL_PLANE_API_KEY=${OAC_CONTROL_PLANE_API_KEY:-}
      - OAC_CONTROL_PLANE_OIDC_DISCOVERY_URL=${OAC_CONTROL_PLANE_OIDC_DISCOVERY_URL:-}
      - OAC_CONTROL_PLANE_OIDC_AUDIENCE=${OAC_CONTROL_PLANE_OIDC_AUDIENCE:-}
      - OAC_SIGNING_KEY_MODE=${OAC_SIGNING_KEY_MODE:-in-process}
      - OAC_VAULT_URL=${OAC_VAULT_URL:-}
      - OAC_VAULT_TOKEN=${OAC_VAULT_TOKEN:-}
    depends_on:
      - postgres

  # --- demo only: not part of a deployment ---------------------------------
  enterprise-backend:
    build: .
    image: openagent-control:local
    profiles: ["demo"]
    # The runtime image installs only the wheel, so examples/ is not in it.
    # Mounted rather than packaged: demo code has no business shipping to
    # users who pip install the gateway.
    entrypoint: ["python", "-m", "examples.enterprise_scenario.serve"]
    environment:
      - OAC_SCENARIO_ISSUER=http://enterprise-backend:8090
      - PYTHONPATH=/opt/oac
    volumes:
      - ./examples:/opt/oac/examples:ro
    ports:
      - "8080:8080"
      - "8090:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://localhost:8090/keys')"
      interval: 2s
      timeout: 3s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    profiles: ["demo"]
    command: ["start-dev", "--http-port=8380"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    ports:
      - "8380:8380"
