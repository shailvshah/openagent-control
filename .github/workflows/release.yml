name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Everything a normal push runs, run again here — including the packaging
  # conformance job. A tag is not evidence that main was green when it was cut.
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    name: tag matches package version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install poetry==2.3.2

      # If these disagree, the artifact on PyPI and the tag in git describe
      # different code — and a PyPI version number cannot be reused once burned,
      # so this has to fail before the upload, not after.
      - name: Compare
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(poetry version --short)"
          echo "tag=$tag  package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match pyproject version $pkg"
            exit 1
          fi

  publish:
    name: publish to PyPI
    needs: [ci, version]
    if: startsWith(github.ref, 'refs/tags/') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/openagent-control/

    # Trusted Publishing: GitHub mints a short-lived OIDC token that PyPI
    # verifies against a publisher it has on file for this repo and workflow.
    # No long-lived API token exists, so there is none to leak — the same
    # argument this project makes about brokered credentials, applied to itself.
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install poetry==2.3.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: poetry build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
