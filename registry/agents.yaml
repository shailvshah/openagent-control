# Master Agent Registry (ADR-0008).
#
# Every agent that may call through the gateway MUST have a record here —
# unregistered SPIFFE IDs are denied and the attempt is receipted in the audit
# ledger. Register/suspend/re-scope agents via PR to this file.
#
# granted_tools entries (ADR-0021) may be a plain tool name, or an object
# carrying per-grant terms:
#
#   granted_tools:
#     - read_query                    # plain grant: no extra terms
#     - name: update_record
#       approval_required: true       # only callable on behalf of a verified
#                                      # human (input.subject != null) — see
#                                      # resources/policies/mcp_authz.rego
#       risk_tier: high                # overrides the agent's own risk_tier
#                                      # for this one capability, for reporting

agents:
  - spiffe_id: spiffe://corp.net/ns/finance/agent/invoice-bot
    display_name: Invoice Bot
    purpose: Read and reconcile finance invoices; propose (never execute) account updates.
    owner: alice@corp.net
    risk_tier: medium
    status: active
    granted_tools:
      - read_query
      - update_record

  # The agent used by the docker-compose stack, which runs with real OIDC
  # identity (OAC_IDENTITY_MODE=oidc-jwks) — the identity is therefore derived
  # from the token's issuer and client-id claim, not an X-Spiffe-ID header.
  # See examples/enterprise_scenario/.
  - spiffe_id: oidc://http://enterprise-backend:8090/finance-invoice-svc
    display_name: Finance Invoice Service
    purpose: Read and reconcile finance invoices via the governed MCP server.
    owner: alice@corp.net
    risk_tier: medium
    status: active
    granted_tools:
      - read_query

  - spiffe_id: spiffe://corp.net/ns/sales/agent/lead-qualifier
    display_name: Lead Qualifier
    purpose: Enrich and qualify inbound sales leads in Salesforce.
    owner: bob@corp.net
    risk_tier: low
    status: active
    granted_tools:
      - salesforce_update_account
